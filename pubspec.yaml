name: forma_app
description: Forma - Flutter mobile application
publish_to: 'none'
version: 1.1.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  clock: ^1.1.1
  supabase_flutter: ^2.5.0
  posthog_flutter: ^5.36.1
  sign_in_with_apple: ^6.1.0
  google_sign_in: ^7.2.0
  crypto: ^3.0.3
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  # The exercise demo relies on this package rendering its web view through
  # an OverlayPortal (6.x): the demo supplies a local Overlay to catch it, so
  # the video stays inside its box instead of floating over the page. After
  # any upgrade, re-check that a playing video scrolls under the pinned tabs
  # and back bar in the exercise detail view.
  youtube_player_iframe: ^6.0.2
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.2
  wakelock_plus: ^1.2.10
  purchases_flutter: ^10.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Roboto Mono is bundled (SIL OFL 1.1, assets/fonts/RobotoMono-OFL.txt) so
  # the mono eyebrows render offline and on first launch without a fetch.
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/RobotoMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700

  # LLDB attach on the iOS simulator stalls for minutes on this setup; the
  # pre-LLDB debug attach works fine, so keep it.
  config:
    enable-lldb-debugging: false
